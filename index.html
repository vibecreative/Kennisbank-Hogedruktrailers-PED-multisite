                "text": "Het Warenwetbesluit Drukapparatuur 2016 (WBDA) vormt samen met de Warenwetregeling Drukapparatuur 2016 het Nederlandse wettelijke kader voor de gebruiksfase van drukapparatuur. Het regelt onder meer de verplichte Keuring voor Ingebruikneming (KvI) en de periodieke herkeuringen."

                "@type": "Answer",
