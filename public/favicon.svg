<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230">
  <defs>
    <clipPath id="shield-clip">
      <path d="M 100 12 
               C 125 24, 160 22, 185 24 
               C 190 60, 195 130, 100 216 
               C 5 130, 10 60, 15 24 
               C 40 22, 75 24, 100 12 Z" />
    </clipPath>
  </defs>

  <!-- Outer Dark Shield Border -->
  <path d="M 100 8 
           C 128 22, 165 20, 192 22 
           C 198 62, 203 138, 100 226 
           C -3 138, 2 62, 8 22 
           C 35 20, 72 22, 100 8 Z" 
        fill="#263238" stroke="#1c262b" stroke-width="2" stroke-linejoin="round" />

  <!-- Inner Shield (Clipped) -->
  <g clip-path="url(#shield-clip)">
    <!-- Left Half: Light Green -->
    <rect x="0" y="0" width="100" height="230" fill="#43A047" />
    <!-- Right Half: Dark Green -->
    <rect x="100" y="0" width="100" height="230" fill="#2E7D32" />
  </g>

  <!-- Inner subtle edge outline for crispness -->
  <path d="M 100 12 
           C 125 24, 160 22, 185 24 
           C 190 60, 195 130, 100 216 
           C 5 130, 10 60, 15 24 
           C 40 22, 75 24, 100 12 Z" 
        fill="none" stroke="#263238" stroke-width="4" stroke-linejoin="round" />

  <!-- Bold White Checkmark with rounded caps -->
  <path d="M 54 116 
           L 86 148 
           L 150 82" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>